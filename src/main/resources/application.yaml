spring:
  application:
    name: blog
  datasource:
    url: jdbc:postgresql://localhost:5433/blog
    username: postgres
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  security:
    user:
      name: user
      password: password
logging:
  level:
    com.simone.blog: DEBUG
jwt:
  secret: ${JWT_SECRET}
  expiration: 7200000

debug: true
